<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/scratch_game_styling.css" />
</head>
<body class="scratch-page">
    <header id="top">
        <div class="header-left">
            <a href="index.html">Resume</a>
            <span>|</span>
            <a href="scratch.html">Scratch</a>
            <span>|</span>
            <a href="game.html">Game</a>
        </div>
        <div class="header-center">
            <h1>Snake Game</h1>
        </div>
    </header>
    
    <div class="container">
        <div class="left"></div>
        
        <div class="body">
            <h2>Play Snake!</h2>
            <canvas id="gameCanvas" width="400" height="400" tabindex="0" style="border: 2px solid white; display: block; margin: 0 auto; outline: none;"></canvas>
            <p style="text-align: center;">Score: <span id="score">0</span></p>
            <p style="text-align: center;">Use arrow keys or WASD to move the snake. Press Space to restart.</p>
        </div>
        
        <div class="right"></div>
    </div>

    <footer>
        <a href="#top">Back to Top</a>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = true;

        function randomTile() {
            return Math.floor(Math.random() * tileCount);
        }

        function generateFood() {
            food = {
                x: randomTile(),
                y: randomTile()
            };
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgb(167, 92, 61)'; // Match background
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            ctx.fillStyle = 'white';
            for (let segment of snake) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            }

            // Draw food
            ctx.fillStyle = '#333';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function update() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameRunning = false;
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameRunning = false;
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function gameLoop() {
            update();
            draw();
        }

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;
            const W_KEY = 87;
            const A_KEY = 65;
            const S_KEY = 83;
            const D_KEY = 68;
            const SPACE_KEY = 32;

            const keyPressed = event.keyCode;

            // Prevent arrow keys and space from scrolling the page
            if ([LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY, SPACE_KEY].includes(keyPressed)) {
                event.preventDefault();
            }
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            let directionChanged = false;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
                directionChanged = true;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
                directionChanged = true;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
                directionChanged = true;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
                directionChanged = true;
            }
            if (keyPressed === A_KEY && !goingRight) {
                dx = -1;
                dy = 0;
                directionChanged = true;
            }
            if (keyPressed === W_KEY && !goingDown) {
                dx = 0;
                dy = -1;
                directionChanged = true;
            }
            if (keyPressed === D_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
                directionChanged = true;
            }
            if (keyPressed === S_KEY && !goingUp) {
                dx = 0;
                dy = 1;
                directionChanged = true;
            }
            if (keyPressed === SPACE_KEY) {
                resetGame();
                directionChanged = true;
            }

        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            generateFood();
        }

        document.addEventListener('keydown', changeDirection);

        // Initialize
        generateFood();
        canvas.focus();
        setInterval(gameLoop, 100);
    </script>
</body>
</html>
